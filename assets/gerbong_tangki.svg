<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <!-- Cylindrical 3D gradient for tank body -->
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="90%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="redBand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="chassisSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Left & Right Couplers -->
  <rect x="2" y="98" width="10" height="18" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <rect x="0" y="103" width="6" height="8" rx="2" fill="#334155"/>
  <rect x="268" y="98" width="10" height="18" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <rect x="274" y="103" width="6" height="8" rx="2" fill="#334155"/>

  <!-- End Walkway Platforms with Safety Handrails -->
  <!-- Left Handrail -->
  <path d="M 12 60 L 12 96 L 24 96" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <rect x="8" y="94" width="20" height="6" fill="#1e293b"/>
  <!-- Right Handrail -->
  <path d="M 268 60 L 268 96 L 256 96" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <rect x="252" y="94" width="20" height="6" fill="#1e293b"/>

  <!-- Main Chassis Frame -->
  <rect x="18" y="94" width="244" height="16" rx="2" fill="url(#chassisSteel)" stroke="#0f172a" stroke-width="2"/>

  <!-- TANK CYLINDRICAL BODY -->
  <!-- Rounded Tank Shell -->
  <rect x="24" y="32" width="232" height="64" rx="28" fill="url(#tankGrad)" stroke="#1e293b" stroke-width="3"/>

  <!-- Red Center Band -->
  <rect x="24" y="58" width="232" height="18" fill="url(#redBand)"/>

  <!-- Tank Reinforcement Bands / Saddles -->
  <rect x="42" y="30" width="6" height="68" rx="2" fill="#0f172a"/>
  <rect x="88" y="30" width="6" height="68" rx="2" fill="#0f172a"/>
  <rect x="186" y="30" width="6" height="68" rx="2" fill="#0f172a"/>
  <rect x="232" y="30" width="6" height="68" rx="2" fill="#0f172a"/>

  <!-- Top Manhole Dome & Pressure Relief Valves -->
  <rect x="122" y="20" width="36" height="14" rx="5" fill="#334155" stroke="#0f172a" stroke-width="2"/>
  <circle cx="140" cy="27" r="4" fill="#fbbf24"/>
  <rect x="130" y="16" width="6" height="5" fill="#94a3b8"/>
  <rect x="144" y="16" width="6" height="5" fill="#94a3b8"/>

  <!-- Central Catwalk & Ladder -->
  <rect x="110" y="28" width="60" height="4" fill="#64748b"/>
  <line x1="135" y1="32" x2="135" y2="94" stroke="#475569" stroke-width="2.5"/>
  <line x1="145" y1="32" x2="145" y2="94" stroke="#475569" stroke-width="2.5"/>
  <line x1="135" y1="45" x2="145" y2="45" stroke="#475569" stroke-width="2"/>
  <line x1="135" y1="60" x2="145" y2="60" stroke="#475569" stroke-width="2"/>
  <line x1="135" y1="75" x2="145" y2="75" stroke="#475569" stroke-width="2"/>

  <!-- PERTAMINA LOGO & LETTERING -->
  <!-- Left Logo Group -->
  <g transform="translate(56, 40)">
    <!-- Pertamina Parallelograms (Blue, Green, Red) -->
    <polygon points="0,2 10,2 7,8 -3,8" fill="#0284c7"/>
    <polygon points="12,2 22,2 19,8 9,8" fill="#16a34a"/>
    <polygon points="5,10 15,10 12,16 2,16" fill="#dc2626"/>
    <text x="26" y="12" font-family="Arial, sans-serif" font-weight="900" font-size="10" fill="#0f172a" letter-spacing="1">PERTAMINA</text>
  </g>

  <!-- Right Side Product & Hazard Placard -->
  <g transform="translate(196, 40)">
    <text x="0" y="10" font-family="Arial, sans-serif" font-weight="900" font-size="7" fill="#0f172a">SOLAR / BBM</text>
    <!-- Flammable Hazard Diamond -->
    <polygon points="12,18 20,26 12,34 4,26" fill="#dc2626" stroke="#ffffff" stroke-width="1"/>
    <text x="10" y="29" font-family="Arial, sans-serif" font-weight="bold" font-size="6" fill="#ffffff">3</text>
    <text x="26" y="27" font-family="monospace" font-weight="bold" font-size="5" fill="#475569">GK-30.000L</text>
  </g>

  <!-- Heavy Freight Bogie 1 (Left) -->
  <g id="bogieTankLeft">
    <rect x="30" y="114" width="58" height="12" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <circle cx="59" cy="120" r="5" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="42" y="118" width="8" height="8" fill="#ef4444"/>
    <rect x="68" y="118" width="8" height="8" fill="#ef4444"/>
    <circle cx="42" cy="136" r="16" fill="url(#wheelGrad)" stroke="#0f172a" stroke-width="3"/>
    <circle cx="42" cy="136" r="8" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <circle cx="42" cy="136" r="3" fill="#0f172a"/>
    <circle cx="76" cy="136" r="16" fill="url(#wheelGrad)" stroke="#0f172a" stroke-width="3"/>
    <circle cx="76" cy="136" r="8" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <circle cx="76" cy="136" r="3" fill="#0f172a"/>
  </g>

  <!-- Heavy Freight Bogie 2 (Right) -->
  <g id="bogieTankRight">
    <rect x="192" y="114" width="58" height="12" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <circle cx="221" cy="120" r="5" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="204" y="118" width="8" height="8" fill="#ef4444"/>
    <rect x="230" y="118" width="8" height="8" fill="#ef4444"/>
    <circle cx="204" cy="136" r="16" fill="url(#wheelGrad)" stroke="#0f172a" stroke-width="3"/>
    <circle cx="204" cy="136" r="8" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <circle cx="204" cy="136" r="3" fill="#0f172a"/>
    <circle cx="238" cy="136" r="16" fill="url(#wheelGrad)" stroke="#0f172a" stroke-width="3"/>
    <circle cx="238" cy="136" r="8" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <circle cx="238" cy="136" r="3" fill="#0f172a"/>
  </g>
</svg>
