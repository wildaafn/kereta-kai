<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <linearGradient id="flatcarSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="orangeBox" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="blueBox" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="corrugation" width="6" height="10" patternUnits="userSpaceOnUse">
      <rect width="3" height="10" fill="#000000" opacity="0.12"/>
      <rect x="3" width="3" height="10" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Left & Right Couplers -->
  <rect x="2" y="98" width="10" height="18" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <rect x="0" y="103" width="6" height="8" rx="2" fill="#334155"/>
  <rect x="268" y="98" width="10" height="18" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <rect x="274" y="103" width="6" height="8" rx="2" fill="#334155"/>

  <!-- FLATBED CAR CHASSIS (Gerbong Datar PPCW) -->
  <rect x="8" y="96" width="264" height="18" rx="3" fill="url(#flatcarSteel)" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Chassis Side Gussets & Stanchion Pockets -->
  <line x1="8" y1="102" x2="272" y2="102" stroke="#64748b" stroke-width="1.5"/>
  <rect x="14" y="96" width="6" height="18" fill="#1e293b"/>
  <rect x="74" y="96" width="6" height="18" fill="#1e293b"/>
  <rect x="137" y="96" width="6" height="18" fill="#1e293b"/>
  <rect x="200" y="96" width="6" height="18" fill="#1e293b"/>
  <rect x="260" y="96" width="6" height="18" fill="#1e293b"/>

  <!-- Twist Locks -->
  <rect x="12" y="92" width="6" height="4" fill="#fbbf24"/>
  <rect x="134" y="92" width="6" height="4" fill="#fbbf24"/>
  <rect x="140" y="92" width="6" height="4" fill="#fbbf24"/>
  <rect x="262" y="92" width="6" height="4" fill="#fbbf24"/>

  <!-- CONTAINER 1: ORANGE (KAI LOGISTIK 20 FT) -->
  <g id="containerLeft">
    <rect x="14" y="32" width="122" height="64" rx="4" fill="url(#orangeBox)" stroke="#7c2d12" stroke-width="2.5"/>
    <rect x="14" y="32" width="122" height="64" rx="4" fill="url(#corrugation)"/>
    <!-- Corner Castings -->
    <rect x="14" y="32" width="7" height="7" fill="#431407"/>
    <rect x="129" y="32" width="7" height="7" fill="#431407"/>
    <rect x="14" y="89" width="7" height="7" fill="#431407"/>
    <rect x="129" y="89" width="7" height="7" fill="#431407"/>
    <!-- Container Doors & Locking Bars -->
    <line x1="75" y1="34" x2="75" y2="94" stroke="#7c2d12" stroke-width="2"/>
    <line x1="50" y1="36" x2="50" y2="92" stroke="#9a3412" stroke-width="1.5"/>
    <line x1="100" y1="36" x2="100" y2="92" stroke="#9a3412" stroke-width="1.5"/>
    <!-- Logo & Text -->
    <rect x="26" y="44" width="98" height="20" rx="3" fill="#ffffff" opacity="0.95"/>
    <text x="32" y="58" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#ea580c">KAI</text>
    <text x="58" y="58" font-family="Arial, sans-serif" font-weight="900" font-size="9" fill="#1e3a8a">LOGISTIK</text>
    <text x="26" y="80" font-family="monospace" font-weight="bold" font-size="6" fill="#fef08a">KLOG 241088-2</text>
  </g>

  <!-- CONTAINER 2: BLUE (KAI LOGISTIK 20 FT) -->
  <g id="containerRight">
    <rect x="144" y="32" width="122" height="64" rx="4" fill="url(#blueBox)" stroke="#1e3a8a" stroke-width="2.5"/>
    <rect x="144" y="32" width="122" height="64" rx="4" fill="url(#corrugation)"/>
    <rect x="144" y="32" width="7" height="7" fill="#0f172a"/>
    <rect x="259" y="32" width="7" height="7" fill="#0f172a"/>
    <rect x="144" y="89" width="7" height="7" fill="#0f172a"/>
    <rect x="259" y="89" width="7" height="7" fill="#0f172a"/>
    <line x1="205" y1="34" x2="205" y2="94" stroke="#172554" stroke-width="2"/>
    <line x1="180" y1="36" x2="180" y2="92" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="230" y1="36" x2="230" y2="92" stroke="#1d4ed8" stroke-width="1.5"/>
    <rect x="156" y="44" width="98" height="20" rx="3" fill="#ffffff" opacity="0.95"/>
    <text x="162" y="58" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#ea580c">KAI</text>
    <text x="188" y="58" font-family="Arial, sans-serif" font-weight="900" font-size="9" fill="#1e3a8a">LOGISTIK</text>
    <text x="156" y="80" font-family="monospace" font-weight="bold" font-size="6" fill="#93c5fd">KLOG 993120-7</text>
  </g>

  <!-- Underframe Brake Cylinders -->
  <rect x="110" y="114" width="60" height="12" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="120" cy="120" r="4" fill="#64748b"/>

  <!-- HEAVY FREIGHT BOGIE 1 (Left) -->
  <g id="bogieLeftFreight">
    <rect x="30" y="114" width="58" height="12" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <circle cx="59" cy="120" r="5" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Heavy Coil Springs -->
    <rect x="42" y="118" width="8" height="8" fill="#f59e0b"/>
    <rect x="68" y="118" width="8" height="8" fill="#f59e0b"/>
    <!-- Wheels -->
    <circle cx="42" cy="136" r="16" fill="url(#wheelGrad)" stroke="#0f172a" stroke-width="3"/>
    <circle cx="42" cy="136" r="8" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <circle cx="42" cy="136" r="3" fill="#0f172a"/>
    <circle cx="76" cy="136" r="16" fill="url(#wheelGrad)" stroke="#0f172a" stroke-width="3"/>
    <circle cx="76" cy="136" r="8" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <circle cx="76" cy="136" r="3" fill="#0f172a"/>
  </g>

  <!-- HEAVY FREIGHT BOGIE 2 (Right) -->
  <g id="bogieRightFreight">
    <rect x="192" y="114" width="58" height="12" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <circle cx="221" cy="120" r="5" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="204" y="118" width="8" height="8" fill="#f59e0b"/>
    <rect x="230" y="118" width="8" height="8" fill="#f59e0b"/>
    <circle cx="204" cy="136" r="16" fill="url(#wheelGrad)" stroke="#0f172a" stroke-width="3"/>
    <circle cx="204" cy="136" r="8" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <circle cx="204" cy="136" r="3" fill="#0f172a"/>
    <circle cx="238" cy="136" r="16" fill="url(#wheelGrad)" stroke="#0f172a" stroke-width="3"/>
    <circle cx="238" cy="136" r="8" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <circle cx="238" cy="136" r="3" fill="#0f172a"/>
  </g>
</svg>
