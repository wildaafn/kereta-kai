<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <linearGradient id="krlSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="krlRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="krlYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="krlGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Rear Gangway Coupler (Left) -->
  <rect x="2" y="78" width="10" height="32" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <rect x="0" y="92" width="6" height="8" rx="2" fill="#334155"/>

  <!-- Main Commuter Car Body -->
  <rect x="8" y="36" width="254" height="78" rx="6" fill="url(#krlSteel)" stroke="#0f172a" stroke-width="3"/>

  <!-- Front Driver Cab Section (Right Face) -->
  <path d="M 230 36 L 268 36 Q 274 36 274 44 L 274 114 L 230 114 Z" fill="url(#krlRed)" stroke="#0f172a" stroke-width="2"/>
  <!-- Front Yellow Accent Face Mask -->
  <rect x="246" y="80" width="28" height="24" rx="2" fill="url(#krlYellow)"/>

  <!-- Destination LED Display on Front Roof -->
  <rect x="238" y="40" width="30" height="8" rx="2" fill="#0f172a"/>
  <text x="240" y="46" font-family="monospace" font-weight="900" font-size="4" fill="#ef4444">JAKARTA KOTA</text>

  <!-- Front Driver Windshield (Facing Right) -->
  <rect x="236" y="50" width="34" height="24" rx="2" fill="url(#krlGlass)" stroke="#0f172a" stroke-width="2"/>
  <!-- Wiper -->
  <line x1="250" y1="72" x2="262" y2="56" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Front Twin Headlights (Glowing Yellow/White) -->
  <circle cx="266" cy="88" r="4.5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="266" cy="88" r="2.5" fill="#ffffff"/>
  <circle cx="266" cy="98" r="4.5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="266" cy="98" r="2.5" fill="#ffffff"/>

  <!-- Front Red Pilot / Skirt -->
  <polygon points="266,114 276,118 276,132 266,128" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>

  <!-- Commuter Red & Yellow Speed Stripes along Side -->
  <rect x="8" y="86" width="224" height="6" fill="url(#krlRed)"/>
  <rect x="8" y="93" width="224" height="5" fill="url(#krlYellow)"/>

  <!-- Double Sliding Passenger Doors -->
  <!-- Door 1 (Left) -->
  <rect x="42" y="44" width="28" height="68" rx="2" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="46" y="50" width="9" height="24" rx="2" fill="url(#krlGlass)"/>
  <rect x="57" y="50" width="9" height="24" rx="2" fill="url(#krlGlass)"/>
  <line x1="56" y1="44" x2="56" y2="112" stroke="#64748b" stroke-width="1.5"/>

  <!-- Door 2 (Right) -->
  <rect x="146" y="44" width="28" height="68" rx="2" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="150" y="50" width="9" height="24" rx="2" fill="url(#krlGlass)"/>
  <rect x="161" y="50" width="9" height="24" rx="2" fill="url(#krlGlass)"/>
  <line x1="160" y1="44" x2="160" y2="112" stroke="#64748b" stroke-width="1.5"/>

  <!-- Passenger Windows -->
  <rect x="16" y="50" width="20" height="24" rx="3" fill="url(#krlGlass)" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="76" y="50" width="30" height="24" rx="3" fill="url(#krlGlass)" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="110" y="50" width="30" height="24" rx="3" fill="url(#krlGlass)" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="180" y="50" width="24" height="24" rx="3" fill="url(#krlGlass)" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Passenger Silhouettes -->
  <circle cx="91" cy="62" r="5" fill="#1e3a8a" opacity="0.6"/>
  <circle cx="125" cy="62" r="5" fill="#1e3a8a" opacity="0.6"/>

  <!-- Branding -->
  <text x="80" y="82" font-family="Arial, sans-serif" font-weight="900" font-size="8" fill="#dc2626">KAI <tspan fill="#0d47a1">Commuter</tspan></text>
  <text x="180" y="82" font-family="monospace" font-weight="bold" font-size="5" fill="#475569">K1 1 18 100</text>

  <!-- Pantograph on Roof -->
  <g stroke="#dc2626" stroke-width="2" fill="none">
    <line x1="90" y1="36" x2="100" y2="20"/>
    <line x1="100" y1="20" x2="118" y2="20"/>
    <line x1="118" y1="20" x2="128" y2="36"/>
    <line x1="94" y1="18" x2="124" y2="18" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- BOGIE 1 (Left) -->
  <g id="bogieKRLLeft">
    <rect x="30" y="118" width="58" height="10" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <circle cx="59" cy="123" r="4" fill="#64748b"/>
    <circle cx="42" cy="136" r="16" fill="url(#wheelGrad)" stroke="#0f172a" stroke-width="3"/>
    <circle cx="42" cy="136" r="8" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <circle cx="42" cy="136" r="3" fill="#0f172a"/>
    <circle cx="76" cy="136" r="16" fill="url(#wheelGrad)" stroke="#0f172a" stroke-width="3"/>
    <circle cx="76" cy="136" r="8" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <circle cx="76" cy="136" r="3" fill="#0f172a"/>
  </g>

  <!-- BOGIE 2 (Right) -->
  <g id="bogieKRLRight">
    <rect x="180" y="118" width="58" height="10" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <circle cx="209" cy="123" r="4" fill="#64748b"/>
    <circle cx="192" cy="136" r="16" fill="url(#wheelGrad)" stroke="#0f172a" stroke-width="3"/>
    <circle cx="192" cy="136" r="8" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <circle cx="192" cy="136" r="3" fill="#0f172a"/>
    <circle cx="226" cy="136" r="16" fill="url(#wheelGrad)" stroke="#0f172a" stroke-width="3"/>
    <circle cx="226" cy="136" r="8" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <circle cx="226" cy="136" r="3" fill="#0f172a"/>
  </g>
</svg>
