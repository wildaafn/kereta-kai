<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <linearGradient id="ssBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="warmCafe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="kaiOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="kaiBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Left & Right Couplers / Gangway Buffers -->
  <rect x="2" y="78" width="10" height="32" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <rect x="0" y="92" width="6" height="8" rx="2" fill="#334155"/>
  <rect x="268" y="78" width="10" height="32" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <rect x="274" y="92" width="6" height="8" rx="2" fill="#334155"/>

  <!-- Main Coach Body -->
  <rect x="8" y="32" width="264" height="82" rx="8" fill="url(#ssBody)" stroke="#0f172a" stroke-width="3"/>
  <!-- Corrugated Ribs -->
  <line x1="8" y1="42" x2="272" y2="42" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="8" y1="46" x2="272" y2="46" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="8" y1="90" x2="272" y2="90" stroke="#64748b" stroke-width="1"/>
  <line x1="8" y1="93" x2="272" y2="93" stroke="#64748b" stroke-width="1"/>

  <!-- KAI Orange & Blue Stripes -->
  <rect x="8" y="96" width="264" height="6" fill="url(#kaiOrange)"/>
  <rect x="8" y="103" width="264" height="6" fill="url(#kaiBlue)"/>

  <!-- Left Service Door (Kitchen Loading) -->
  <rect x="18" y="44" width="20" height="66" rx="3" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="23" y="50" width="10" height="18" rx="2" fill="#38bdf8"/>

  <!-- Kitchen & Serving Counter Area -->
  <rect x="44" y="46" width="34" height="36" rx="4" fill="url(#warmCafe)" stroke="#0f172a" stroke-width="2"/>
  <!-- Coffee Cup / Chef Icon Silhouette -->
  <path d="M 54 62 L 68 62 L 66 74 L 56 74 Z" fill="#78350f"/>
  <path d="M 68 64 Q 73 68 67 72" fill="none" stroke="#78350f" stroke-width="2"/>
  <text x="48" y="56" font-family="Arial, sans-serif" font-weight="900" font-size="6" fill="#78350f">KAFE KAI</text>

  <!-- Dining Area Windows (Cafe Style with Table Lamps) -->
  <!-- Dining Table 1 -->
  <rect x="84" y="46" width="34" height="36" rx="4" fill="url(#warmCafe)" stroke="#0f172a" stroke-width="2"/>
  <circle cx="101" cy="58" r="4" fill="#fef08a"/>
  <rect x="94" y="70" width="14" height="4" rx="1" fill="#78350f"/>

  <!-- Dining Table 2 -->
  <rect x="124" y="46" width="34" height="36" rx="4" fill="url(#warmCafe)" stroke="#0f172a" stroke-width="2"/>
  <circle cx="141" cy="58" r="4" fill="#fef08a"/>
  <rect x="134" y="70" width="14" height="4" rx="1" fill="#78350f"/>

  <!-- Dining Table 3 -->
  <rect x="164" y="46" width="34" height="36" rx="4" fill="url(#warmCafe)" stroke="#0f172a" stroke-width="2"/>
  <circle cx="181" cy="58" r="4" fill="#fef08a"/>
  <rect x="174" y="70" width="14" height="4" rx="1" fill="#78350f"/>

  <!-- Dining Table 4 -->
  <rect x="204" y="46" width="34" height="36" rx="4" fill="url(#warmCafe)" stroke="#0f172a" stroke-width="2"/>
  <circle cx="221" cy="58" r="4" fill="#fef08a"/>
  <rect x="214" y="70" width="14" height="4" rx="1" fill="#78350f"/>

  <!-- Right Passenger Entry Door -->
  <rect x="244" y="44" width="20" height="66" rx="3" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="249" y="50" width="10" height="22" rx="2" fill="#38bdf8"/>

  <!-- Labels -->
  <text x="96" y="93" font-family="Arial, sans-serif" font-weight="900" font-size="8" fill="#0d47a1" letter-spacing="1">KERETA MAKAN</text>
  <text x="180" y="93" font-family="monospace" font-weight="bold" font-size="6" fill="#475569">M1 0 18 05</text>

  <!-- AC units on roof -->
  <rect x="70" y="24" width="48" height="8" rx="3" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="170" y="24" width="48" height="8" rx="3" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Bogies -->
  <g id="bogieM1Left">
    <rect x="30" y="118" width="58" height="10" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <circle cx="59" cy="123" r="4" fill="#64748b"/>
    <circle cx="42" cy="136" r="16" fill="url(#wheelGrad)" stroke="#0f172a" stroke-width="3"/>
    <circle cx="42" cy="136" r="8" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <circle cx="42" cy="136" r="3" fill="#0f172a"/>
    <circle cx="76" cy="136" r="16" fill="url(#wheelGrad)" stroke="#0f172a" stroke-width="3"/>
    <circle cx="76" cy="136" r="8" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <circle cx="76" cy="136" r="3" fill="#0f172a"/>
  </g>
  <g id="bogieM1Right">
    <rect x="192" y="118" width="58" height="10" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <circle cx="221" cy="123" r="4" fill="#64748b"/>
    <circle cx="204" cy="136" r="16" fill="url(#wheelGrad)" stroke="#0f172a" stroke-width="3"/>
    <circle cx="204" cy="136" r="8" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <circle cx="204" cy="136" r="3" fill="#0f172a"/>
    <circle cx="238" cy="136" r="16" fill="url(#wheelGrad)" stroke="#0f172a" stroke-width="3"/>
    <circle cx="238" cy="136" r="8" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <circle cx="238" cy="136" r="3" fill="#0f172a"/>
  </g>
</svg>
