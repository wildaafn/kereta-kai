<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <linearGradient id="steamBlack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="brassGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="redChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <!-- Rear Coupler (Left) -->
  <rect x="2" y="98" width="10" height="20" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <rect x="0" y="103" width="6" height="8" rx="2" fill="#334155"/>

  <!-- Red Underframe Chassis Bar -->
  <rect x="10" y="108" width="260" height="12" rx="2" fill="url(#redChassis)" stroke="#0f172a" stroke-width="2"/>

  <!-- Front Cowcatcher Pilot (Right) -->
  <polygon points="264,112 276,122 276,134 264,130" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>

  <!-- COAL TENDER BUNKER (Far Left) -->
  <rect x="12" y="58" width="46" height="52" rx="3" fill="url(#steamBlack)" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Piled Coal -->
  <path d="M 14 58 Q 24 46 35 48 Q 46 44 56 58 Z" fill="#020617"/>

  <!-- DRIVER'S CABIN (Left-Center) -->
  <rect x="54" y="34" width="68" height="76" rx="4" fill="url(#steamBlack)" stroke="#0f172a" stroke-width="3"/>
  <!-- Curved Cabin Roof -->
  <path d="M 50 36 Q 88 28 126 36 L 124 42 L 52 42 Z" fill="#0f172a"/>
  <!-- Cabin Windows -->
  <rect x="62" y="46" width="18" height="26" rx="6" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
  <rect x="90" y="46" width="18" height="26" rx="6" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
  <rect x="114" y="60" width="8" height="48" fill="#1e293b"/>

  <!-- CYLINDRICAL BOILER (Center to Right) -->
  <rect x="122" y="52" width="124" height="58" rx="14" fill="url(#steamBlack)" stroke="#0f172a" stroke-width="3"/>
  <!-- Boiler Bands (Brass/Gold Straps) -->
  <rect x="144" y="50" width="4" height="62" fill="url(#brassGold)"/>
  <rect x="176" y="50" width="4" height="62" fill="url(#brassGold)"/>
  <rect x="210" y="50" width="4" height="62" fill="url(#brassGold)"/>

  <!-- Front Boiler Smokebox Door (Right Front) -->
  <ellipse cx="246" cy="80" rx="8" ry="24" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <circle cx="246" cy="80" r="3" fill="#94a3b8"/>

  <!-- BRASS STEAM DOME & BELL (On Top of Boiler) -->
  <!-- Brass Bell -->
  <rect x="148" y="38" width="12" height="14" rx="4" fill="url(#brassGold)" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="154" cy="40" r="3" fill="#facc15"/>
  <!-- Giant Steam Dome -->
  <path d="M 172 52 C 172 32 200 32 200 52 Z" fill="url(#brassGold)" stroke="#0f172a" stroke-width="2"/>
  <!-- Steam Safety Valve -->
  <rect x="184" y="24" width="4" height="12" fill="url(#brassGold)"/>

  <!-- SMOKESTACK CHIMNEY (Far Right on Top) -->
  <path d="M 226 52 L 228 20 L 222 18 L 222 14 L 244 14 L 244 18 L 238 20 L 240 52 Z" fill="url(#steamBlack)" stroke="#0f172a" stroke-width="2"/>
  <!-- Puff of White Steam Coming Out -->
  <circle cx="233" cy="8" r="5" fill="#ffffff" opacity="0.8"/>
  <circle cx="225" cy="2" r="7" fill="#ffffff" opacity="0.6"/>
  <circle cx="215" cy="-2" r="9" fill="#ffffff" opacity="0.4"/>

  <!-- FRONT HEADLIGHT (Glowing Forward on the Right) -->
  <rect x="246" y="56" width="14" height="18" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <circle cx="254" cy="65" r="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="254" cy="65" r="3" fill="#ffffff"/>

  <!-- MAK ITAM & B2502 NAMEPLATES -->
  <rect x="64" y="82" width="28" height="9" rx="2" fill="#b45309" stroke="#facc15" stroke-width="1"/>
  <text x="68" y="89" font-family="Arial, sans-serif" font-weight="900" font-size="6" fill="#ffffff">B2502</text>

  <rect x="148" y="74" width="54" height="12" rx="2" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="153" y="83" font-family="Georgia, serif" font-weight="900" font-size="8" fill="#fef08a" letter-spacing="1">MAK ITAM</text>

  <!-- Piston Cylinder (Right Lower Front) -->
  <rect x="214" y="102" width="36" height="18" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>

  <!-- STEAM DRIVING WHEELS (Red Spoked Wheels, cy=136) -->
  <!-- Tender Wheel (Left) -->
  <circle cx="34" cy="136" r="14" fill="#334155" stroke="#0f172a" stroke-width="3"/>
  <circle cx="34" cy="136" r="6" fill="#94a3b8"/>

  <!-- Big Driving Wheel 1 -->
  <circle cx="82" cy="136" r="18" fill="url(#wheelGrad)" stroke="#0f172a" stroke-width="3"/>
  <circle cx="82" cy="136" r="8" fill="#fef08a" stroke="#0f172a" stroke-width="2"/>
  <circle cx="82" cy="136" r="3" fill="#0f172a"/>

  <!-- Big Driving Wheel 2 -->
  <circle cx="134" cy="136" r="18" fill="url(#wheelGrad)" stroke="#0f172a" stroke-width="3"/>
  <circle cx="134" cy="136" r="8" fill="#fef08a" stroke="#0f172a" stroke-width="2"/>
  <circle cx="134" cy="136" r="3" fill="#0f172a"/>

  <!-- Big Driving Wheel 3 -->
  <circle cx="186" cy="136" r="18" fill="url(#wheelGrad)" stroke="#0f172a" stroke-width="3"/>
  <circle cx="186" cy="136" r="8" fill="#fef08a" stroke="#0f172a" stroke-width="2"/>
  <circle cx="186" cy="136" r="3" fill="#0f172a"/>

  <!-- Small Front Leading Wheel (Right) -->
  <circle cx="240" cy="136" r="12" fill="#334155" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="240" cy="136" r="5" fill="#94a3b8"/>

  <!-- Side Connecting Side Rods (Connecting Big Driving Wheels) -->
  <rect x="78" y="132" width="112" height="7" rx="3" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
  <!-- Piston Crosshead Rod -->
  <line x1="186" y1="135" x2="228" y2="111" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
</svg>
